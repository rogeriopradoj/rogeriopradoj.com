baseURL = "https://rogeriopradoj.com/"
languageCode = "pt-br"
title = "Rogerio Prado J"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = true
buildFuture = true
buildExpired = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Rogerio Prado J"
  description = "Desenvolvimento, Data Analytics e TI em geral"
  author = "Rogerio Prado de Jesus"

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true

  defaultTheme = "auto"
  disableThemeToggle = false

  DateFormat = "2006-01-02"

  [params.fuseOpts]
    threshold = 0.2
    minMatchCharLength = 3

  [params.homeInfoParams]
    Title = "👋 Olá, eu sou o Rogerio"
    Content = """
Blog técnico sobre Desenvolvimento, Data Analytics e TI em geral.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rogeriopradoj"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/rogeriopradoj/"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/rogeriopradoj"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[menu]

  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    identifier = "about"
    name = "Sobre / About / Acerca"
    url = "/about/"
    weight = 2

  [[menu.main]]
    identifier = "slides"
    name = "Slides"
    url = "/slides/"
    weight = 3

  [[menu.main]]
    identifier = "pradoj"
    name = "PradoJ.com"
    url = "/pradoj-com/"
    weight = 4

  [[menu.main]]
    identifier = "contato"
    name = "Contato / Contact"
    url = "/contato/"
    weight = 5

  [[menu.main]]
    identifier = "gift"
    name = "Gift / Apoie / Doe"
    url = "/gift/"
    weight = 6

  [[menu.main]]
    identifier = "livro"
    name = "Meu Livro"
    url = "/livro/"
    weight = 7

  [[menu.main]]
    identifier = "search"
    name = "Pesquisar"
    url = "/search/"
    weight = 99

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    noClasses = false

[permalinks]
  posts = "/:year/:month/:day/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]
